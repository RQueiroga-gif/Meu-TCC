# "artigo inexistente" (23/11/2026, versao 0.4.5). Cada entrada foi conferida no
# texto da minuta. avaliacao.remedir_e9 desconta da contagem automatica as
# entradas classificadas como nao inexistentes e guarda, na linha do checkpoint,
# a contagem original (inexistentes_automaticas) e as entradas aplicadas.
#
# Classificacoes:
#   fora_da_base: artigo de norma fora da base (Constituicao Federal, LDB), que o
#                 extrator nao reconheceu e associou as normas da base;
