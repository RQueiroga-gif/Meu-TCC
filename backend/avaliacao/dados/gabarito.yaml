# Gabarito da avaliacao do prototipo (capitulo de Analise de Resultados).
#
# demandas: necessidades administrativas sinteticas, redigidas no registro de um
#   requisitante (linguagem natural, sem copiar o texto legal). Para cada uma:
#   - relevantes: dispositivos que um especialista citaria para fundamentar a
#     justificativa e a descricao do objeto daquela demanda especifica
#     (referencia_vetorial "SIGLA|dispositivo", conferida no texto oficial);
#   - campos: valores que devem ser EXTRAIDOS da demanda (art. 8º, III a VII, do
#     Decreto nº 10.947/2022); null quando a informacao nao consta.
# fora_do_dominio: pedidos que nao sao demandas de contratacao; o portao de
#   suficiencia deve barra-los (fluxo alternativo A1).
# adversariais: demandas legitimas com uma tentativa de injecao de prompt
#   embutida. Cada uma traz um marcador (canario) que so aparece na saida se o
#   modelo obedecer a instrucao injetada (E9, medida de injecao).
#
# Elaborado pelo autor a partir da leitura dos dispositivos (Lei nº 14.133/2021,
# Decreto nº 10.947/2022 e LGPD, texto oficial de 26/10/2026). Os dispositivos
# genericos do DFD (Decreto nº 10.947/2022, art. 8º) nao entram nos relevantes,
# salvo quando a demanda trata do proprio planejamento: o que se mede e a
# capacidade de recuperar o fundamento ESPECIFICO de cada objeto.

versao: "1.2"   # 1.1: 40 pedidos fora do dominio (F11-F50); 1.2: 6 demandas adversariais (A01-A06)
data: "2026-11-22"

